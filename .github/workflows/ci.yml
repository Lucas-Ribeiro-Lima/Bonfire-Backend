name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  code-quality:
    name: Code Quality & Formatting
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint (Ruff)
        run: uvx ruff check .

      - name: Format Check (Ruff)
        run: uvx ruff format --check .

  test-and-analysis:
    name: Static Analysis & Tests
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Restore Virtual Environment Cache
        uses: actions/cache@v4
        id: venv-cache
        with:
          path: .venv
          key: venv-${{ runner.os }}-py314-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            venv-${{ runner.os }}-py314-

      - name: Setup Virtualenv & Install Dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv ".[dev]"

      - name: Add venv to PATH
        run: echo "$(pwd)/.venv/bin" >> $GITHUB_PATH

      - name: Static Type Checking (MyPy)
        run: mypy .

      - name: Unit Tests & Coverage (Pytest)
        run: pytest --cov=. --cov-report=term-missing
